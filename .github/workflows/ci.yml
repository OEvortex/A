name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DA_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j
      - name: Version is consistent
        run: |
          cmake_version="$(sed -n 's/^project(Alang VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          a_version="$(./build/a --version | sed 's/.* //')"
          lsp_version="$(./build/a-lsp --version | sed 's/.* //')"
          package_version="$(node -e 'console.log(require("./tools/vscode-a/package.json").version)')"
          echo "CMake=$cmake_version a=$a_version a-lsp=$lsp_version package=$package_version"
          [ "$cmake_version" = "$a_version" ] || exit 1
          [ "$cmake_version" = "$lsp_version" ] || exit 1
          [ "$cmake_version" = "$package_version" ] || exit 1
      - name: Test
        run: ctest --test-dir build --output-on-failure


  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug \
            -DA_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build-asan -j
      - name: Test
        run: tests/integration/run_tests.sh build-asan/a
